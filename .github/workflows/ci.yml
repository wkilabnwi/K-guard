name: K-Guard CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-codegen:
    name: Lint & BPF Codegen Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install LLVM & Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev linux-headers-generic

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Verify eBPF Code Generation
        run: |
          go generate ./...
          git diff --exit-code || (echo "eBPF generated files are out of sync with bpf/*.c! Run 'go generate ./...' locally." && exit 1)

  unit-tests:
    name: Unit Tests (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: lint-and-codegen
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Run Go Unit Tests
        run: go test -v -race ./internal/config/... ./internal/processor/... ./internal/alert/... ./internal/audit/... ./internal/safety/... ./internal/trust/...

      - name: Verify Sigma Transpiler
        run: |
          go run main.go -convert-sigma tests/test_web_shell.yml > /dev/null
          echo "Sigma transpiler validated successfully."


  ebpf-integration:
    name: eBPF Kernel Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Check BTF Availability
        run: |
          uname -r
          ls -la /sys/kernel/btf/vmlinux || echo "WARNING: BTF not present on runner kernel"

      - name: Run eBPF Integration Tests as Root
        run: |
          sudo -E $(which go) test -v -tags=integration ./internal/ebpf/...

  release:
    name: Build & Publish Releases
    runs-on: ubuntu-latest
    needs: ebpf-integration
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Build Binaries (amd64 & arm64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/k-guard-linux-amd64 main.go
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build -ldflags="-s -w" -o dist/k-guard-linux-arm64 main.go
          cd dist && sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/k-guard-linux-amd64
            dist/k-guard-linux-arm64
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}